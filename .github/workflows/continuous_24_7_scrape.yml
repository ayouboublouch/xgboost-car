name: 24/7 Continuous Car Harvester

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Duration in hours for continuous harvesting'
        required: false
        default: '3.5'

concurrency:
  group: continuous-harvest
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  continuous-harvest:
    name: Continuous 3.5-Hour Harvester
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'scrapers/requirements_scraper.txt'

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scrapers/requirements_scraper.txt || pip install requests beautifulsoup4 lxml pandas pyarrow fake-useragent

      - name: Environment Diagnostics
        run: |
          python -c "import sys; print('Python version:', sys.version)"
          python scrapers/continuous_harvester.py --help || true

      - name: Run 3.5-Hour Continuous Harvester
        run: |
          mkdir -p data/raw data/tracking
          python scrapers/continuous_harvester.py --duration-hours ${{ github.event.inputs.duration_hours || '3.5' }}

      - name: Commit New Inventory and Master Database
        if: always()
        run: |
          git config --global user.name "autohouse-harvester[bot]"
          git config --global user.email "harvester@users.noreply.github.com"
          python -c "from scrapers.continuous_harvester import update_master_database; from pathlib import Path; update_master_database(Path('data/raw'))"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "feat(ingestion): persist continuous harvest batch [skip ci]"
            for i in 1 2 3 4 5; do
              echo "Attempt $i: rebasing and pushing to origin main..."
              if git pull --rebase origin main && git push origin main; then
                echo "Successfully pushed continuous harvest batch."
                break
              fi
              echo "Push rejected or collision detected, aborting rebase and retrying in 5s..."
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          else
            echo "No new unique listings to commit."
          fi
