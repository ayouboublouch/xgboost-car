name: Scheduled Avito Scraper

on:
  schedule:
    # Run twice daily: at 02:00 and 14:00 UTC
    - cron: '0 2,14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (test queries only)'
        required: false
        type: boolean
        default: false
      max_pages:
        description: 'Max pages per query'
        required: false
        type: number
        default: 1

permissions:
  contents: write

jobs:
  scrape-avito:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'scrapers/requirements_scraper.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scrapers/requirements_scraper.txt

      - name: Run Avito scraper
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scrapers/avito_scraper.py --dry-run
          else
            python scrapers/avito_scraper.py --max-pages ${{ github.event.inputs.max_pages || 1 }}
          fi

      - name: Commit and push scraped data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage new raw files
          git add data/raw/

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No new scraped data to commit."
          else
            TODAY=$(date +'%Y-%m-%d')
            git commit -m "Automated scrape: new Avito data (${TODAY}) [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "Successfully committed and pushed new raw data."
          fi
