name: Parallel Multi-Source Car Scraper

on:
  schedule:
    # Run twice daily: at 02:00 and 14:00 UTC
    - cron: '0 2,14 * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Maximum pages per platform'
        required: false
        type: number
        default: 15

permissions:
  contents: write

jobs:
  scrape:
    name: Scrape ${{ matrix.source }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: [avito, moteur, wandaloo, kifal, siaracash]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'scrapers/requirements_scraper.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scrapers/requirements_scraper.txt

      - name: Run ${{ matrix.source }} scraper
        run: |
          MAX_PAGES=${{ github.event.inputs.max_pages || 15 }}
          python scrapers/run_all.py --source ${{ matrix.source }} --max-pages $MAX_PAGES

      - name: Commit and push scraped batch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebase and push loop to safely handle concurrent matrix completions
          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt: synchronizing with origin main..."
            git pull --rebase origin main || true
            git add data/raw/

            if git diff --staged --quiet; then
              echo "No new listings to commit from ${{ matrix.source }}."
              break
            fi

            git commit -m "chore(data): ingest new listings from ${{ matrix.source }} [skip ci]" || true

            if git push origin main; then
              echo "Successfully pushed batch from ${{ matrix.source }}."
              break
            fi

            SLEEP_SEC=$(( attempt * 3 + RANDOM % 4 ))
            echo "Push rejected due to concurrent matrix push. Retrying in ${SLEEP_SEC}s..."
            sleep $SLEEP_SEC
          done
