name: Parallel Multi-Source Car Scraper

on:
  schedule:
    - cron: '0 2,14 * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Pages to scrape per source'
        required: false
        default: '3'

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    name: Scrape ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        source: [moteur, wandaloo, avito, kifal, siaracash]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'scrapers/requirements_scraper.txt'

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scrapers/requirements_scraper.txt || pip install requests beautifulsoup4 lxml pandas pyarrow fake-useragent

      - name: Environment Diagnostics
        run: |
          python -c "import sys; print('Python version:', sys.version)"
          python scrapers/run_all.py --help || true

      - name: Run Scraper for ${{ matrix.source }}
        id: run_scraper
        continue-on-error: true
        run: |
          mkdir -p data/raw
          python scrapers/run_all.py --source ${{ matrix.source }} --max-pages ${{ github.event.inputs.max_pages || 3 }}

      - name: Upload Scraped Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-data-${{ matrix.source }}
          path: data/raw/${{ matrix.source }}_*
          if-no-files-found: ignore

  aggregate-and-commit:
    name: Aggregate & Commit Multi-Source Data
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies for consolidation
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow

      - name: Download all scraped artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: raw-data-*
          path: data/raw
          merge-multiple: true

      - name: Consolidate daily raw scrapes
        run: |
          mkdir -p data/raw
          python scrapers/run_all.py --source none --consolidate

      - name: Commit and push newly collected data
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git status
          git add data/raw/
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): ingest new car listings"
            git pull --rebase origin main
            git push origin main
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new raw data detected to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Training Workflow
        if: steps.commit.outputs.committed == 'true'
        run: gh workflow run train_model.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
