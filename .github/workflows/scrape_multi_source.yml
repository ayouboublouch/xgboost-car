name: Parallel Multi-Source Car Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: scrape-multi-source
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    name: Scrape ${{ matrix.source }} (${{ matrix.page_label }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - source: moteur
            start_page: 121
            max_pages: 60
            page_label: "pages 121-180"
          - source: moteur
            start_page: 181
            max_pages: 60
            page_label: "pages 181-240"
          - source: moteur
            start_page: 241
            max_pages: 60
            page_label: "pages 241-300"
          - source: wandaloo
            start_page: 41
            max_pages: 40
            page_label: "pages 41-80"
          - source: wandaloo
            start_page: 81
            max_pages: 40
            page_label: "pages 81-120"
          - source: avito
            start_page: 25
            max_pages: 40
            page_label: "pages 25-64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'scrapers/requirements_scraper.txt'

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scrapers/requirements_scraper.txt || pip install requests beautifulsoup4 lxml pandas pyarrow fake-useragent

      - name: Environment Diagnostics
        run: |
          python -c "import sys; print('Python version:', sys.version)"
          python scrapers/run_all.py --help || true

      - name: Run Partitioned Scraper for ${{ matrix.source }} (start page ${{ matrix.start_page }})
        id: run_scraper
        continue-on-error: true
        run: |
          mkdir -p data/raw data/tracking
          python scrapers/run_all.py \
            --source ${{ matrix.source }} \
            --start-page ${{ matrix.start_page }} \
            --max-pages ${{ matrix.max_pages }} \
            --output-filename "scraped_${{ matrix.source }}_part_${{ matrix.start_page }}.csv"

      - name: Upload Scraped Artifact & Telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-data-${{ matrix.source }}-part-${{ matrix.start_page }}
          path: |
            data/raw/scraped_${{ matrix.source }}_part_${{ matrix.start_page }}.*
            data/tracking/session_${{ matrix.source }}_part_${{ matrix.start_page }}.json
          if-no-files-found: ignore

  aggregate-and-commit:
    name: Aggregate & Commit Multi-Source Data
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: write
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'scrapers/requirements_scraper.txt'

      - name: Install dependencies for consolidation
        run: |
          python -m pip install --upgrade pip
          pip install -r scrapers/requirements_scraper.txt || pip install requests beautifulsoup4 lxml pandas pyarrow fake-useragent

      - name: Download all scraped artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: worker-data-*
          path: data/downloads
          merge-multiple: true

      - name: Move partition artifacts into data/raw/ and data/tracking/
        run: |
          mkdir -p data/raw data/tracking
          # Move all scraped chunk data files (CSV & Parquet) directly into data/raw/
          find data/downloads -type f \( -name "scraped_*.csv" -o -name "scraped_*.parquet" \) -exec mv -v {} data/raw/ \; || true

          # Move all session telemetry files directly into data/tracking/
          find data/downloads -type f -name "session_*.json" -exec mv -v {} data/tracking/ \; || true

          # Delete downloads directory
          rm -rf data/downloads

          echo "Verified data/raw contents:"
          ls -la data/raw/
          echo "Verified data/tracking contents:"
          ls -la data/tracking/

      - name: Consolidate scraped chunks, telemetry, and master database
        run: |
          python -c "from scrapers.continuous_harvester import aggregate_parallel_worker_batches; p = aggregate_parallel_worker_batches(); print('Consolidated into:', p)"

      - name: Commit and push newly collected data
        id: commit
        run: |
          git config --global user.name "autohouse-harvester[bot]"
          git config --global user.email "harvester@users.noreply.github.com"
          git status
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "feat(ingestion): persist 6-worker multi-source scrape batch [skip ci]"
            for i in 1 2 3 4 5; do
              echo "Attempt $i: rebasing and pushing to origin main..."
              if git pull --rebase origin main && git push origin main; then
                echo "Successfully pushed multi-source batch."
                echo "committed=true" >> "$GITHUB_OUTPUT"
                break
              fi
              echo "Push rejected or collision detected, aborting rebase and retrying in 5s..."
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          else
            echo "No new raw data detected to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Training Workflow
        if: steps.commit.outputs.committed == 'true'
        continue-on-error: true
        run: |
          gh workflow run train_model.yml || echo "Training workflow trigger skipped or already queued."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
