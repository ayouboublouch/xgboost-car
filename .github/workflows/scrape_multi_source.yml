name: Parallel Multi-Source Car Scraper

on:
  schedule:
    - cron: '0 2,14 * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Pages to scrape per source'
        required: false
        default: '3'

permissions:
  contents: write

jobs:
  scrape:
    name: Scrape ${{ matrix.source }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        source: [avito, moteur, wandaloo, kifal, siaracash]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'scrapers/requirements_scraper.txt'

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scrapers/requirements_scraper.txt || pip install requests beautifulsoup4 lxml pandas pyarrow fake-useragent

      - name: Environment Diagnostics
        run: |
          python -c "import sys; print('Python version:', sys.version)"
          python scrapers/run_all.py --help || true

      - name: Run Scraper for ${{ matrix.source }}
        id: run_scraper
        run: |
          mkdir -p data/raw
          python scrapers/run_all.py --source ${{ matrix.source }} --max-pages ${{ github.event.inputs.max_pages || 3 }}

      - name: Upload Scraped Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw-data-${{ matrix.source }}
          path: data/raw/
          if-no-files-found: ignore

  aggregate-and-commit:
    name: Aggregate & Commit Multi-Source Data
    needs: scrape
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: always()

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download all scraped artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: raw-data-*
          path: data/raw/
          merge-multiple: true

      - name: Commit and push newly collected data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git status
          git add data/raw/
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): ingest multi-source listings [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No new raw data detected to commit."
          fi
