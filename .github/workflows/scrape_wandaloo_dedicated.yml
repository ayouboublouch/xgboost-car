name: Dedicated Wandaloo.com Cloud Scraper (All Pages & Showrooms)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6,18 * * *'

concurrency:
  group: scrape-wandaloo-dedicated
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  scrape-wandaloo:
    name: Wandaloo (${{ matrix.page_label }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - start_page: 1
            max_pages: 22
            page_label: "pages 1-22 (General & Showrooms)"
          - start_page: 23
            max_pages: 23
            page_label: "pages 23-45 (Deep Catalog)"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'scrapers/requirements_scraper.txt'

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scrapers/requirements_scraper.txt || pip install requests beautifulsoup4 lxml pandas pyarrow fake-useragent curl_cffi

      - name: Environment Diagnostics
        run: |
          python -c "import sys; print('Python version:', sys.version)"
          python scrapers/wandaloo_scraper.py --help || true

      - name: Run Dedicated Scraper for Wandaloo.com (${{ matrix.page_label }})
        id: run_scraper
        continue-on-error: true
        run: |
          mkdir -p data/raw data/tracking
          python scrapers/run_all.py \
            --source wandaloo \
            --start-page ${{ matrix.start_page }} \
            --max-pages ${{ matrix.max_pages }} \
            --output-filename "scraped_wandaloo_part_${{ matrix.start_page }}.csv"

      - name: Upload Scraped Wandaloo Chunk & Telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wandaloo-chunk-${{ matrix.start_page }}
          path: |
            data/raw/scraped_wandaloo_part_${{ matrix.start_page }}.*
            data/tracking/session_wandaloo_part_${{ matrix.start_page }}.json
          if-no-files-found: ignore

  aggregate-and-commit:
    name: Aggregate Wandaloo Chunks & Retrain
    needs: scrape-wandaloo
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: write
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'scrapers/requirements_scraper.txt'

      - name: Install dependencies for consolidation
        run: |
          python -m pip install --upgrade pip
          pip install -r scrapers/requirements_scraper.txt || pip install requests beautifulsoup4 lxml pandas pyarrow fake-useragent curl_cffi

      - name: Download all scraped Wandaloo chunks
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: wandaloo-chunk-*
          path: data/downloads
          merge-multiple: true

      - name: Move partition artifacts into data/raw/ and data/tracking/
        run: |
          mkdir -p data/raw data/tracking
          echo "Inspecting data/downloads before move:"
          find data/downloads -type f || true

          # Move all scraped chunk data files (CSV & Parquet) directly into data/raw/
          find data/downloads -type f \( -name "scraped_wandaloo_part_*.csv" -o -name "scraped_wandaloo_part_*.parquet" \) -exec mv -v {} data/raw/ \; || true

          # Move all session telemetry files directly into data/tracking/
          find data/downloads -type f -name "session_wandaloo_part_*.json" -exec mv -v {} data/tracking/ \; || true

          # Delete downloads directory
          rm -rf data/downloads

          echo "Verified data/raw contents:"
          ls -la data/raw/
          echo "Verified data/tracking contents:"
          ls -la data/tracking/

      - name: Consolidate scraped chunks, telemetry, and master database
        run: |
          python -c "from pathlib import Path; from scrapers.continuous_harvester import aggregate_parallel_worker_batches, update_master_database; aggregate_parallel_worker_batches(); p = update_master_database(Path('data/raw')); print('Consolidated into:', p)"

      - name: Commit and push newly collected data
        id: commit
        run: |
          git config --global user.name "autohouse-harvester[bot]"
          git config --global user.email "harvester@users.noreply.github.com"
          git status
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "feat(ingestion): persist dedicated Wandaloo 45-page batch [skip ci]"
            for i in 1 2 3 4 5; do
              echo "Attempt $i: syncing and pushing to origin main..."
              git stash push --include-untracked -m "ci-temp-stash" || true
              if git pull --rebase --autostash origin main; then
                git stash pop 2>/dev/null || true
                if git push origin main; then
                  echo "Successfully pushed Wandaloo batch."
                  echo "committed=true" >> "$GITHUB_OUTPUT"
                  break
                fi
              else
                echo "Rebase failed, aborting..."
                git rebase --abort 2>/dev/null || true
                git stash pop 2>/dev/null || true
              fi
              sleep 5
            done
          else
            echo "No new raw data detected to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Training Workflow
        if: steps.commit.outputs.committed == 'true'
        continue-on-error: true
        run: |
          gh workflow run train_model.yml || echo "Training workflow trigger skipped or already queued."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
