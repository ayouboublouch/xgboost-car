name: Train & Evaluate Price Model

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/raw/**'
      - 'data/processed/**'
      - 'src/**'

concurrency:
  group: train-model
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  train-model:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgomp1 build-essential

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure required directories exist
        run: mkdir -p data/raw data/processed models

      - name: Run Data Cleaning & Verification
        run: |
          python src/clean.py
          python src/features.py

      - name: Run Model Training
        run: |
          python src/train.py --device cpu

      - name: Commit and push model artifacts
        run: |
          git config --global user.name "autohouse-mlops[bot]"
          git config --global user.email "mlops@users.noreply.github.com"
          git add models/ data/processed/ reports/ || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(ml): update trained CatBoost model, predictions and benchmarks [skip ci]"
            for i in 1 2 3 4 5; do
              echo "Attempt $i: rebasing and pushing model artifacts to origin main..."
              git stash push --include-untracked -m "ci-temp-stash" 2>/dev/null || true
              if git pull --rebase origin main && git push origin main; then
                echo "Successfully pushed model artifacts and predictions."
                break
              fi
              echo "Push rejected or collision detected, aborting rebase and retrying in 5s..."
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          else
            echo "No new model artifacts to commit."
          fi
