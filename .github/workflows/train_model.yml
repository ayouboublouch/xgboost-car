name: Train & Evaluate Price Model

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/raw/**'
      - 'src/**'

permissions:
  contents: write

jobs:
  train-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgomp1 build-essential

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure required directories exist
        run: mkdir -p data/raw data/processed models

      - name: Run Data Cleaning & Verification
        run: |
          python src/clean.py
          python src/features.py

      - name: Run Model Training
        run: |
          python src/train.py --device cpu

      - name: Commit and push trained models and reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add models/ data/processed/
          if ! git diff --staged --quiet; then
            git commit -m "chore(ml): update trained CatBoost model and benchmarks [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes in models or processed data to commit."
          fi
